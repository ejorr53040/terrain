[workspace]
resolver = "3"
members = ["crates/terrain-hands", "crates/terrain-app"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
terrain-hands = { path = "crates/terrain-hands" }
bevy = "0.19"
avian3d = { version = "0.7", default-features = false, features = ["3d", "f32", "parry-f32", "parallel"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.12"

# Bevy is unusably slow unoptimized; keep our own code debuggable.
[profile.dev.package."*"]
opt-level = 3
