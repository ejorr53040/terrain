[workspace]
resolver = "3"
members = ["crates/terrain-hands", "crates/terrain-app", "crates/terrain-desktop"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
terrain-hands = { path = "crates/terrain-hands" }
bevy = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Bevy is unusably slow unoptimized; keep our own code debuggable.
[profile.dev.package."*"]
opt-level = 3
